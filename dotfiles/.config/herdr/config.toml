[ui.toast]
delivery = "herdr"

[theme]
auto_switch = false
name = "vesper"

[keys]
focus_agent = "prefix+cmd+1..9"
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_right = ["prefix+l", "alt+l"]
focus_pane_up = ["prefix+k", "alt+k"]
next_agent = "alt+shift+j"
next_tab = "alt+shift+l"
prefix = "ctrl+;"
previous_agent = "alt+shift+k"
previous_tab = "alt+shift+h"
split_horizontal = ["prefix+minus", "alt+minus"]
split_vertical = ["prefix+v", "alt+v"]
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"

[experimental]
kitty_graphics = true

[ui]
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
